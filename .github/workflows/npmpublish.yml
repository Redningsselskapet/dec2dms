name: Node.js Package

# Tests run on every push and pull request. Publishing happens only when a
# version tag (v1.2.3) is pushed, and uses npm trusted publishing: npm trusts
# this workflow through GitHub's OIDC token, so no npm token is stored in the
# repository. Configured on npmjs.com under the package's Settings ->
# Trusted publishing (repository Redningsselskapet/dec2dms, workflow
# npmpublish.yml).
#
# To release: bump "version" in package.json, commit, then
#   git tag v<version> && git push origin master v<version>
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow (trusted publishing)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@redningsselskapet/dec2dms@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --access public
